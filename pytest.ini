[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    integration: exercises parsers + filesystem + load_normalized_bundle (no API calls).
    needs_local_inputs: requires optional MLB fixtures under inputs/ (skipped when absent).
    exhaustive: broader edge-case matrix used for pre-delivery confidence checks.
    live_openai: opt-in smoke tests that require OPENAI_API_KEY and explicit enablement.
